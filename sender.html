<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send a Message</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    max-width: 480px;
    margin: 50px auto;
    padding: 20px;
    text-align: center;
    color: #1a1a1a;
  }
  h2 {
    font-weight: 600;
    margin-bottom: 20px;
  }
  h3 {
    font-weight: 600;
    font-size: 1em;
    text-align: left;
    margin: 30px 0 10px;
    color: #555;
  }
  #lock-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-top: 80px;
  }
  #lock-screen input {
    font-size: 1.3em;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #ccc;
    text-align: center;
    width: 220px;
  }
  #lock-screen button {
    font-size: 1.1em;
    padding: 12px 34px;
  }
  #lock-error {
    color: #c62828;
    font-size: 0.9em;
    min-height: 1.2em;
  }
  #app { display: none; }
  #name-field {
    text-align: left;
    margin-bottom: 16px;
  }
  #name-field label {
    display: block;
    font-size: 0.85em;
    color: #555;
    margin-bottom: 4px;
  }
  #name-input {
    width: 100%;
    font-size: 1.1em;
    padding: 10px 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  #photo-field {
    text-align: left;
    margin-bottom: 16px;
  }
  #photo-field label {
    display: block;
    font-size: 0.85em;
    color: #555;
    margin-bottom: 4px;
  }
  #photo-preview {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    object-fit: cover;
    margin-top: 8px;
    display: none;
    border: 1px solid #ccc;
  }
  textarea {
    width: 100%;
    height: 120px;
    font-size: 1.2em;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
  }
  button {
    font-size: 1.3em;
    padding: 15px 50px;
    margin-top: 16px;
    background: #1565c0;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:active {
    background: #0d47a1;
  }
  button:disabled {
    background: #90a4ae;
  }
  #status {
    margin-top: 16px;
    min-height: 1.4em;
    font-size: 1em;
    color: #2e7d32;
  }
  #history-list {
    list-style: none;
    padding: 0;
    margin: 0;
    text-align: left;
  }
  #history-list li {
    padding: 10px 12px;
    border-radius: 8px;
    background: #f2f2f2;
    margin-bottom: 8px;
    font-size: 0.95em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  #history-list .msg-text {
    word-break: break-word;
  }
  #history-list .msg-response {
    font-weight: 600;
    white-space: nowrap;
  }
  #history-list .msg-time {
    color: #777;
    font-size: 0.85em;
    white-space: nowrap;
  }
  #history-list .msg-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  #history-empty {
    color: #888;
    font-size: 0.9em;
  }
</style>
</head>
<body>

<div id="lock-screen">
  <div style="font-size:1.1em;">Enter password</div>
  <input type="password" id="password-input" autofocus>
  <button id="unlock-button">Unlock</button>
  <div id="lock-error"></div>
</div>

<div id="app">
  <h2>Send a message to the tablet</h2>
  <div id="name-field">
    <label for="name-input">Your name</label>
    <input type="text" id="name-input" placeholder="e.g. Sarah">
  </div>
  <div id="photo-field">
    <label for="photo-input">Your photo (optional, saved once)</label>
    <input type="file" id="photo-input" accept="image/*">
    <img id="photo-preview" alt="Your photo">
  </div>
  <textarea id="message-input" placeholder="Type your message..."></textarea><br>
  <button id="send-button">Send</button>
  <div id="status"></div>

  <h3>Last 20 messages</h3>
  <ul id="history-list"></ul>
  <div id="history-empty" style="display:none;">No messages sent yet</div>
</div>

<script>
  // ---- Set the same password here, in receiver.html, and in your Firestore rules ----
  const APP_PASSWORD = "moonshine98";
  // How many days to keep messages before they're auto-deleted.
  const RETENTION_DAYS = 30;
  // -------------------------------------------------------------------------------------

  const firebaseConfig = {
    apiKey: "AIzaSyDhPPm0i-8lqK_BWFYg0mytHI2Ef-dAuSo",
    authDomain: "tablet-messenger-rinaldi.firebaseapp.com",
    projectId: "tablet-messenger-rinaldi",
    storageBucket: "tablet-messenger-rinaldi.firebasestorage.app",
    messagingSenderId: "1060203781816",
    appId: "1:1060203781816:web:fb626e04536a6e3befde4d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const messagesRef = db.collection("messages");
  const sendersRef = db.collection("senders");

  const lockScreenEl = document.getElementById("lock-screen");
  const appEl = document.getElementById("app");
  const passwordInputEl = document.getElementById("password-input");
  const unlockButtonEl = document.getElementById("unlock-button");
  const lockErrorEl = document.getElementById("lock-error");

  const inputEl = document.getElementById("message-input");
  const nameInputEl = document.getElementById("name-input");
  const photoInputEl = document.getElementById("photo-input");
  const photoPreviewEl = document.getElementById("photo-preview");
  const buttonEl = document.getElementById("send-button");
  const statusEl = document.getElementById("status");
  const historyListEl = document.getElementById("history-list");
  const historyEmptyEl = document.getElementById("history-empty");

  function nameKey(name) {
    return name.trim().toLowerCase();
  }

  const savedName = localStorage.getItem("tabletMessengerSenderName");
  if (savedName) {
    nameInputEl.value = savedName;
    sendersRef
      .doc(nameKey(savedName))
      .get()
      .then((doc) => {
        if (doc.exists && doc.data().photo) {
          photoPreviewEl.src = doc.data().photo;
          photoPreviewEl.style.display = "block";
        }
      })
      .catch((err) => console.warn(err));
  }

  photoInputEl.addEventListener("change", () => {
    const file = photoInputEl.files[0];
    if (!file) return;
    const name = nameInputEl.value.trim();
    if (!name) {
      alert("Please enter your name first, then choose a photo.");
      photoInputEl.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        // Resize/crop to a small square thumbnail so it stays cheap to store.
        const size = 200;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);

        const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
        photoPreviewEl.src = dataUrl;
        photoPreviewEl.style.display = "block";

        localStorage.setItem("tabletMessengerSenderName", name);
        sendersRef
          .doc(nameKey(name))
          .set({ name: name, photo: dataUrl, passcode: APP_PASSWORD }, { merge: true })
          .then(() => {
            statusEl.textContent = "Photo saved!";
            setTimeout(() => (statusEl.textContent = ""), 2000);
          })
          .catch((err) => {
            statusEl.style.color = "#c62828";
            statusEl.textContent = "Failed to save photo.";
            console.error(err);
          });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Color for each possible response, so it's easy to scan the list.
  const RESPONSE_COLORS = {
    Yes: "#2e7d32",
    No: "#c62828",
    OK: "#1565c0",
    "Please Call Me": "#ef6c00"
  };

  let started = false;

  function unlock() {
    lockScreenEl.style.display = "none";
    appEl.style.display = "block";
    localStorage.setItem("tabletMessengerUnlocked", "true");
    if (!started) {
      started = true;
      startApp();
    }
  }

  function tryUnlock() {
    if (passwordInputEl.value === APP_PASSWORD) {
      unlock();
    } else {
      lockErrorEl.textContent = "Incorrect password";
    }
  }

  unlockButtonEl.addEventListener("click", tryUnlock);
  passwordInputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  if (localStorage.getItem("tabletMessengerUnlocked") === "true") {
    unlock();
  }

  function deleteOldMessages() {
    const cutoff = Date.now() - RETENTION_DAYS * 24 * 60 * 60 * 1000;
    messagesRef
      .where("sentAt", "<", cutoff)
      .get()
      .then((snapshot) => {
        snapshot.forEach((doc) => {
          doc.ref.delete().catch((err) => console.warn("Could not delete old message:", err));
        });
      })
      .catch((err) => console.warn("Cleanup query failed:", err));
  }

  function startApp() {
    deleteOldMessages();

    buttonEl.addEventListener("click", () => {
      const msg = inputEl.value.trim();
      if (!msg) return;
      const senderName = nameInputEl.value.trim();
      localStorage.setItem("tabletMessengerSenderName", senderName);

      buttonEl.disabled = true;
      messagesRef
        .add({
          text: msg,
          senderName: senderName,
          acknowledged: false,
          response: null,
          sentAt: Date.now(),
          passcode: APP_PASSWORD
        })
        .then(() => {
          statusEl.textContent = "Sent!";
          inputEl.value = "";
          setTimeout(() => (statusEl.textContent = ""), 2000);
        })
        .catch((err) => {
          statusEl.style.color = "#c62828";
          statusEl.textContent = "Failed to send — check your connection.";
          console.error(err);
        })
        .finally(() => {
          buttonEl.disabled = false;
        });
    });

    // Live list of the last 20 messages, newest first, with response status.
    messagesRef.orderBy("sentAt", "desc").limit(20).onSnapshot(
      (snapshot) => {
        historyListEl.innerHTML = "";

        if (snapshot.empty) {
          historyEmptyEl.style.display = "block";
          return;
        }
        historyEmptyEl.style.display = "none";

        snapshot.forEach((doc) => {
          const data = doc.data();
          const li = document.createElement("li");

          const textSpan = document.createElement("span");
          textSpan.className = "msg-text";
          textSpan.textContent = data.senderName
            ? data.senderName + ": " + data.text
            : data.text;

          const rightDiv = document.createElement("div");
          rightDiv.className = "msg-right";

          const responseSpan = document.createElement("span");
          responseSpan.className = "msg-response";
          if (data.acknowledged && data.response) {
            responseSpan.textContent = data.response;
            responseSpan.style.color = RESPONSE_COLORS[data.response] || "#2e7d32";
          } else {
            responseSpan.textContent = "⏳ Waiting";
            responseSpan.style.color = "#999";
          }

          const timeSpan = document.createElement("span");
          timeSpan.className = "msg-time";
          timeSpan.textContent = data.sentAt
            ? new Date(data.sentAt).toLocaleString()
            : "";

          rightDiv.appendChild(responseSpan);
          rightDiv.appendChild(timeSpan);

          li.appendChild(textSpan);
          li.appendChild(rightDiv);
          historyListEl.appendChild(li);
        });
      },
      (error) => {
        console.error(error);
      }
    );
  }
</script>

</body>
</html>
