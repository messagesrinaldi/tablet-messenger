<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send a Message</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    max-width: 480px;
    margin: 50px auto;
    padding: 20px;
    text-align: center;
    color: #1a1a1a;
  }
  h2 {
    font-weight: 600;
    margin-bottom: 20px;
  }
  textarea {
    width: 100%;
    height: 120px;
    font-size: 1.2em;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
  }
  button {
    font-size: 1.3em;
    padding: 15px 50px;
    margin-top: 16px;
    background: #1565c0;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:active {
    background: #0d47a1;
  }
  button:disabled {
    background: #90a4ae;
  }
  #status {
    margin-top: 16px;
    min-height: 1.4em;
    font-size: 1em;
    color: #2e7d32;
  }
</style>
</head>
<body>

<h2>Send a message to the tablet</h2>
<textarea id="message-input" placeholder="Type your message..."></textarea><br>
<button id="send-button">Send</button>
<div id="status"></div>


// Your web app's Firebase configuration
<script>
  // ---- PASTE YOUR FIREBASE CONFIG HERE (same values as in receiver.html) ----
  const firebaseConfig = {
    apiKey: "AIzaSyDhPPm0i-8lqK_BWFYg0mytHI2Ef-dAuSo",
    authDomain: "tablet-messenger-rinaldi.firebaseapp.com",
    projectId: "tablet-messenger-rinaldi",
    storageBucket: "tablet-messenger-rinaldi.firebasestorage.app",
    messagingSenderId: "1060203781816",
    appId: "1:1060203781816:web:fb626e04536a6e3befde4d"
  };
  // -----------------------------------------------------------------------------

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const docRef = db.collection("messages").doc("current");

  const inputEl = document.getElementById("message-input");
  const buttonEl = document.getElementById("send-button");
  const statusEl = document.getElementById("status");

  buttonEl.addEventListener("click", () => {
    const msg = inputEl.value.trim();
    if (!msg) return;

    buttonEl.disabled = true;
    docRef
      .set({ text: msg, acknowledged: false, sentAt: Date.now() })
      .then(() => {
        statusEl.textContent = "Sent!";
        inputEl.value = "";
        setTimeout(() => (statusEl.textContent = ""), 2000);
      })
      .catch((err) => {
        statusEl.style.color = "#c62828";
        statusEl.textContent = "Failed to send — check your connection.";
        console.error(err);
      })
      .finally(() => {
        buttonEl.disabled = false;
      });
  });
</script>

</body>
</html>
