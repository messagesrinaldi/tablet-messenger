<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send a Message</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    max-width: 480px;
    margin: 50px auto;
    padding: 20px;
    text-align: center;
    color: #1a1a1a;
  }
  h2 {
    font-weight: 600;
    margin-bottom: 20px;
  }
  h3 {
    font-weight: 600;
    font-size: 1em;
    text-align: left;
    margin: 30px 0 10px;
    color: #555;
  }
  textarea {
    width: 100%;
    height: 120px;
    font-size: 1.2em;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
  }
  button {
    font-size: 1.3em;
    padding: 15px 50px;
    margin-top: 16px;
    background: #1565c0;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:active {
    background: #0d47a1;
  }
  button:disabled {
    background: #90a4ae;
  }
  #status {
    margin-top: 16px;
    min-height: 1.4em;
    font-size: 1em;
    color: #2e7d32;
  }
  #history-list {
    list-style: none;
    padding: 0;
    margin: 0;
    text-align: left;
  }
  #history-list li {
    padding: 10px 12px;
    border-radius: 8px;
    background: #f2f2f2;
    margin-bottom: 8px;
    font-size: 0.95em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  #history-list .msg-text {
    word-break: break-word;
  }
  #history-list .msg-response {
    font-weight: 600;
    white-space: nowrap;
  }
  #history-list .msg-time {
    color: #777;
    font-size: 0.85em;
    white-space: nowrap;
  }
  #history-list .msg-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  #history-empty {
    color: #888;
    font-size: 0.9em;
  }
</style>
</head>
<body>

<h2>Send a message to the tablet</h2>
<textarea id="message-input" placeholder="Type your message..."></textarea><br>
<button id="send-button">Send</button>
<div id="status"></div>

<h3>Last 20 messages</h3>
<ul id="history-list"></ul>
<div id="history-empty" style="display:none;">No messages sent yet</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDhPPm0i-8lqK_BWFYg0mytHI2Ef-dAuSo",
    authDomain: "tablet-messenger-rinaldi.firebaseapp.com",
    projectId: "tablet-messenger-rinaldi",
    storageBucket: "tablet-messenger-rinaldi.firebasestorage.app",
    messagingSenderId: "1060203781816",
    appId: "1:1060203781816:web:fb626e04536a6e3befde4d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const messagesRef = db.collection("messages");

  const inputEl = document.getElementById("message-input");
  const buttonEl = document.getElementById("send-button");
  const statusEl = document.getElementById("status");
  const historyListEl = document.getElementById("history-list");
  const historyEmptyEl = document.getElementById("history-empty");

  // Color for each possible response, so it's easy to scan the list.
  const RESPONSE_COLORS = {
    Yes: "#2e7d32",
    No: "#c62828",
    OK: "#1565c0",
    "Call Me": "#ef6c00"
  };

  buttonEl.addEventListener("click", () => {
    const msg = inputEl.value.trim();
    if (!msg) return;

    buttonEl.disabled = true;
    messagesRef
      .add({ text: msg, acknowledged: false, response: null, sentAt: Date.now() })
      .then(() => {
        statusEl.textContent = "Sent!";
        inputEl.value = "";
        setTimeout(() => (statusEl.textContent = ""), 2000);
      })
      .catch((err) => {
        statusEl.style.color = "#c62828";
        statusEl.textContent = "Failed to send — check your connection.";
        console.error(err);
      })
      .finally(() => {
        buttonEl.disabled = false;
      });
  });

  // Live list of the last 20 messages, newest first, with response status.
  messagesRef.orderBy("sentAt", "desc").limit(20).onSnapshot(
    (snapshot) => {
      historyListEl.innerHTML = "";

      if (snapshot.empty) {
        historyEmptyEl.style.display = "block";
        return;
      }
      historyEmptyEl.style.display = "none";

      snapshot.forEach((doc) => {
        const data = doc.data();
        const li = document.createElement("li");

        const textSpan = document.createElement("span");
        textSpan.className = "msg-text";
        textSpan.textContent = data.text;

        const rightDiv = document.createElement("div");
        rightDiv.className = "msg-right";

        const responseSpan = document.createElement("span");
        responseSpan.className = "msg-response";
        if (data.acknowledged && data.response) {
          responseSpan.textContent = data.response;
          responseSpan.style.color = RESPONSE_COLORS[data.response] || "#2e7d32";
        } else {
          responseSpan.textContent = "⏳ Waiting";
          responseSpan.style.color = "#999";
        }

        const timeSpan = document.createElement("span");
        timeSpan.className = "msg-time";
        timeSpan.textContent = data.sentAt
          ? new Date(data.sentAt).toLocaleString()
          : "";

        rightDiv.appendChild(responseSpan);
        rightDiv.appendChild(timeSpan);

        li.appendChild(textSpan);
        li.appendChild(rightDiv);
        historyListEl.appendChild(li);
      });
    },
    (error) => {
      console.error(error);
    }
  );
</script>

</body>
</html>
