<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Message Receiver</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #14181f;
    color: #f5f5f5;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #lock-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  #lock-screen input {
    font-size: 1.6em;
    padding: 14px 18px;
    border-radius: 10px;
    border: none;
    text-align: center;
    width: 260px;
  }
  #lock-screen button {
    font-size: 1.4em;
    padding: 14px 40px;
    background: #1565c0;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #lock-error {
    color: #ef5350;
    font-size: 1em;
    min-height: 1.2em;
  }
  #app { display: none; }
  #waiting {
    font-size: 1.4em;
    color: #6b7280;
  }
  #message-box {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 92vw;
    height: 88vh;
  }
  #text-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    overflow: hidden;
    min-height: 0;
  }
  #message-text {
    line-height: 1.25;
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    margin: 0;
    max-width: 100%;
  }
  #button-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(10px, 2.2vmin, 28px);
    flex-shrink: 0;
    padding-top: clamp(12px, 2vmin, 30px);
  }
  .response-button {
    font-size: clamp(1rem, 4.2vmin, 2.4rem);
    padding: clamp(14px, 2.8vmin, 34px) clamp(22px, 5.5vmin, 60px);
    color: white;
    border: none;
    border-radius: clamp(8px, 1.6vmin, 18px);
    cursor: pointer;
    min-width: clamp(110px, 18vmin, 220px);
  }
  .response-button:active {
    filter: brightness(0.85);
  }
  #btn-yes { background: #2e7d32; }
  #btn-no { background: #c62828; }
  #btn-ok { background: #1565c0; }
  #btn-callme { background: #ef6c00; }
  #status {
    position: fixed;
    bottom: 10px;
    right: 14px;
    font-size: 0.75em;
    color: #444;
  }
</style>
</head>
<body>

<div id="lock-screen">
  <div style="font-size:1.3em;">Enter password</div>
  <input type="password" id="password-input" autofocus>
  <button id="unlock-button">Unlock</button>
  <div id="lock-error"></div>
</div>

<div id="app">
  <div id="waiting">Waiting for a message&hellip;</div>

  <div id="message-box">
    <div id="text-wrapper">
      <div id="message-text"></div>
    </div>
    <div id="button-row">
      <button id="btn-yes" class="response-button" data-response="Yes">Yes</button>
      <button id="btn-no" class="response-button" data-response="No">No</button>
      <button id="btn-ok" class="response-button" data-response="OK">OK</button>
      <button id="btn-callme" class="response-button" data-response="Please Call Me">📞 Please Call Me</button>
    </div>
  </div>
</div>

<div id="status">connecting&hellip;</div>

<script>
  // ---- Set the same password here, in sender.html, and in your Firestore rules ----
  const APP_PASSWORD = "moonshine98";
  // -----------------------------------------------------------------------------------

  const firebaseConfig = {
    apiKey: "AIzaSyDhPPm0i-8lqK_BWFYg0mytHI2Ef-dAuSo",
    authDomain: "tablet-messenger-rinaldi.firebaseapp.com",
    projectId: "tablet-messenger-rinaldi",
    storageBucket: "tablet-messenger-rinaldi.firebasestorage.app",
    messagingSenderId: "1060203781816",
    appId: "1:1060203781816:web:fb626e04536a6e3befde4d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const messagesRef = db.collection("messages");

  const lockScreenEl = document.getElementById("lock-screen");
  const appEl = document.getElementById("app");
  const passwordInputEl = document.getElementById("password-input");
  const unlockButtonEl = document.getElementById("unlock-button");
  const lockErrorEl = document.getElementById("lock-error");

  const waitingEl = document.getElementById("waiting");
  const boxEl = document.getElementById("message-box");
  const textWrapperEl = document.getElementById("text-wrapper");
  const textEl = document.getElementById("message-text");
  const statusEl = document.getElementById("status");
  const responseButtons = document.querySelectorAll(".response-button");

  let currentDocId = null;
  let started = false;

  function fitMessageText() {
    if (!textWrapperEl.clientWidth || !textWrapperEl.clientHeight) return;

    let fontSize = Math.min(window.innerWidth, window.innerHeight) * 0.16;
    const minFontSize = 16;
    textEl.style.fontSize = fontSize + "px";

    let guard = 0;
    while (
      guard < 60 &&
      fontSize > minFontSize &&
      (textEl.scrollWidth > textWrapperEl.clientWidth ||
        textEl.scrollHeight > textWrapperEl.clientHeight)
    ) {
      fontSize -= Math.max(2, fontSize * 0.04);
      textEl.style.fontSize = fontSize + "px";
      guard++;
    }
  }

  window.addEventListener("resize", () => {
    if (boxEl.style.display !== "none") fitMessageText();
  });

  function unlock() {
    lockScreenEl.style.display = "none";
    appEl.style.display = "block";
    localStorage.setItem("tabletMessengerUnlocked", "true");
    if (!started) {
      started = true;
      startListening();
    }
  }

  function tryUnlock() {
    if (passwordInputEl.value === APP_PASSWORD) {
      unlock();
    } else {
      lockErrorEl.textContent = "Incorrect password";
    }
  }

  unlockButtonEl.addEventListener("click", tryUnlock);
  passwordInputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  if (localStorage.getItem("tabletMessengerUnlocked") === "true") {
    unlock();
  }

  function showWaiting() {
    waitingEl.style.display = "block";
    boxEl.style.display = "none";
  }

  function showMessage(text) {
    textEl.textContent = text;
    waitingEl.style.display = "none";
    boxEl.style.display = "flex";
    // Give the browser a moment to lay out the box before measuring it.
    requestAnimationFrame(fitMessageText);
  }

  function startListening() {
    // Always watch the single most recently sent message.
    messagesRef.orderBy("sentAt", "desc").limit(1).onSnapshot(
      (snapshot) => {
        statusEl.textContent = "connected";
        if (snapshot.empty) {
          currentDocId = null;
          showWaiting();
          return;
        }
        const doc = snapshot.docs[0];
        const data = doc.data();
        currentDocId = doc.id;
        if (data.text && data.acknowledged === false) {
          showMessage(data.text);
        } else {
          showWaiting();
        }
      },
      (error) => {
        statusEl.textContent = "connection error";
        console.error(error);
      }
    );

    responseButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!currentDocId) return;
        const response = btn.dataset.response;
        messagesRef
          .doc(currentDocId)
          .update({ acknowledged: true, response: response })
          .catch((err) => console.error(err));
      });
    });

    // Keep the screen from dimming/locking while this page is open, on
    // browsers that support the Wake Lock API (most recent Chrome on Android).
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          await navigator.wakeLock.request("screen");
        }
      } catch (err) {
        console.warn("Wake lock not available:", err);
      }
    }
    requestWakeLock();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });
  }
</script>

</body>
</html>
